name: CI/CD Frontend -> EKS (test -> build -> push -> deploy)

on:
  workflow_dispatch:
  push:
    branches: [ deploy ]

env:
  AWS_REGION:   ${{ secrets.AWS_REGION }}
  ECR_REPO:     ${{ secrets.ECR_REPOSITORY }}
  EKS_CLUSTER:  ${{ secrets.EKS_CLUSTER_NAME }}
  DEPLOY_NAME:  casino-frontend

jobs:
  # ETAPA 1 - PRUEBAS UNITARIAS. Si fallan se corta el pipeline.

  test:
    name: Pruebas unitarias frontend (Karma/Jasmine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Correr tests (modo CI, sin watch, Chrome headless)
        run: npm test -- --watch=false --browsers=ChromeHeadless

  # ETAPA 2 - BUILD + PUSH + DEPLOY. Solo si 'test' fue exitoso.
  build-push-deploy:
    name: Build, push y deploy a EKS
    runs-on: ubuntu-latest
    needs: test                        # si los test fallan, esto NO corre

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      #Build & Push (2 tags)
      - name: Build & push imagen
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA:      ${{ github.sha }}
        run: |
          IMAGE=$REGISTRY/$ECR_REPO
          docker build \
            -t $IMAGE:$SHA \
            -t $IMAGE:latest \
            .
          docker push $IMAGE:$SHA
          docker push $IMAGE:latest

      #Deploy en EKS
      - name: Instalar kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl

      - name: Conectar kubectl al clúster
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Actualizar imagen en deployment.yaml y aplicar manifiestos
        env:
          REGISTRY:    ${{ steps.ecr.outputs.registry }}
          ACCOUNT_ID:  ${{ secrets.AWS_ACCOUNT_ID }}
          SHA:         ${{ github.sha }}
        run: |
          # Sustituir marcadores de Account ID / región / tag
          sed -i \
            "s|<ACCOUNT_ID>|$ACCOUNT_ID|g; \
             s|<REGION>|$AWS_REGION|g; \
             s|:latest|:$SHA|g" \
            k8s/deployment.yaml

          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Esperar rollout y mostrar estado
        run: |
          kubectl rollout status deployment/$DEPLOY_NAME --timeout=180s
          kubectl get pods -l app=$DEPLOY_NAME -o wide
          echo "=== URL pública del LoadBalancer (puede tardar 2-3 min) ==="
          kubectl get svc casino-frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'; echo