apiVersion: autoscaling/v2
kind: HorizontalAutoscaler
metadata: casino-frontend
metada:
  name: casino-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: casino-frontend
  mixReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpy
        targer: 
          type: Utilization
          averegeUtilization: 50 #escale cuando la cpu promedio supera limite del 50%
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0    # escala hacia arriba de inmediato
    scaleDown:
      stabilizationWindowSeconds: 60   # espera 60 s de calma antes de reducir pods